<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 3D walk through GITAM Bengaluru dressed for Epoch, the GitHub Community Club fest.">
<link rel="icon" href="/favicon.svg">
<title>Epoch Walkthrough</title>
<style>
*{box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}
/* Layout: full-bleed 3D campus; notes card on the left, stops as a commit rail along the bottom, map bottom-right */
:root{
  --bg:#cfe3ee; --paper:#ffffff; --soft:#f5f7f6; --ink:#0b0b0f; --mute:#595866; --hair:rgba(18,18,26,.12);
  --brand:#1f883d; --gold:#c98a00;
  --display:"Mona Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a2e; --paper:#0f0f17; --soft:#181824; --ink:#f2f2f2; --mute:#a3a4bd; --hair:rgba(255,255,255,.12);
  --brand:#3fc84e; --gold:#ffc933; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a2e; --paper:#0f0f17; --soft:#181824; --ink:#f2f2f2; --mute:#a3a4bd; --hair:rgba(255,255,255,.12);
  --brand:#3fc84e; --gold:#ffc933; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;touch-action:none;cursor:grab;display:block;width:100%;height:100%}
#scene.drag{cursor:grabbing}
.panel{background:var(--paper);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--shadow)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));padding:10px 14px;display:flex;flex-direction:column;gap:2px}
#hud b{font-weight:800;font-size:18px;letter-spacing:-.01em}
#hud span{font-family:var(--mono);font-size:11px;color:var(--mute)}
#modes{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));display:flex;padding:3px;gap:2px}
#modes button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
#modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#card{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 80px);width:340px;max-height:calc(100% - 230px);overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
#card .eyebrow{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px}
#card h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.015em;text-wrap:balance;line-height:1.15}
#card p{margin:0;font-size:14px;line-height:1.5}
#card h3{margin:0;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
#card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
#card li{font-size:14px;line-height:1.45;padding-left:16px;position:relative}
#card li::before{content:"";position:absolute;left:2px;top:.5em;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--brand)}
.when{display:flex;flex-wrap:wrap;gap:6px}
.when span{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--hair);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--hair);border-left-width:4px;display:inline-flex;gap:6px;align-items:center}
.chips i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.budget{font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:8px;background:var(--soft);border:1px dashed var(--hair)}
.budget b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:2px}
#cardToggle{display:none}
#rail{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;pointer-events:none}
#rail>*{pointer-events:auto}
.step{border:1px solid var(--hair);background:var(--paper);box-shadow:var(--shadow);border-radius:999px;width:38px;height:38px;flex:none;cursor:pointer;font-size:16px;display:grid;place-items:center}
#stopsWrap{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:6px 10px;border-radius:999px}
#stopsWrap::-webkit-scrollbar{display:none}
#stops{list-style:none;margin:0;padding:0;display:flex;position:relative;width:max-content}
#stops::before{content:"";position:absolute;left:14px;right:14px;top:13px;height:2px;background:var(--mute);opacity:.45}
#stops li button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 8px;min-width:78px}
#stops .dot{width:14px;height:14px;border-radius:50%;background:var(--paper);border:2.5px solid var(--mute);position:relative;z-index:1;transition:transform .2s cubic-bezier(.23,1,.32,1)}
#stops .lbl{font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--paper);padding:2px 7px;border-radius:5px;border:1px solid var(--hair)}
#stops button[aria-current="step"] .dot{background:var(--brand);border-color:var(--brand);transform:scale(1.25)}
#stops button[aria-current="step"] .lbl{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#stops button:hover .dot{transform:scale(1.2)}
#head{font-family:var(--mono);font-size:11px;padding:6px 10px;white-space:nowrap}
#map{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:156px;height:222px;padding:6px}
#map canvas{width:100%;height:100%;display:block;border-radius:6px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);font-size:12.5px;padding:7px 12px;color:var(--mute);white-space:nowrap;transition:opacity .4s}
#hint kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--hair);border-radius:4px;color:var(--ink)}
#pad{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:none;flex-direction:column;gap:8px}
#pad button{width:56px;height:56px;border-radius:50%;border:1px solid var(--hair);background:var(--paper);box-shadow:var(--shadow);font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--mute);background:var(--bg)}
@media (pointer:coarse){#pad{display:flex}#map{display:none}#hint .k{display:none}}
@media (max-width:760px){
  #hud{padding:8px 11px}#hud b{font-size:15px}
  #modes button{padding:6px 9px;font-size:12px}
  #card{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);max-height:42%;padding:14px 16px}
  #card.closed>*:not(.top){display:none}
  #card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  #cardToggle{display:inline-block;border:1px solid var(--hair);background:var(--soft);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;flex:none}
  #card h2{font-size:18px}
  #pad{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 70px)}
  #map,#hint,#head{display:none}
}
@media (prefers-reduced-motion:reduce){#stops .dot{transition:none}}
</style>
</head>
<body>

<canvas id="scene" aria-label="3D walkthrough of GITAM Bengaluru decorated for Epoch"></canvas>
<div id="loading">laying out the campus…</div>
<div id="hud" class="panel"><b>Epoch, on the day</b><span>GITAM Bengaluru · December 2026</span></div>
<div id="modes" class="panel" role="group" aria-label="Time of day">
  <button id="mDay" aria-pressed="true">Daytime</button>
  <button id="mEve" aria-pressed="false">18:00 closing</button>
</div>
<aside id="card" class="panel" aria-live="polite">
  <div class="top"><div class="eyebrow" style="flex:1"><span id="cStep"></span><span id="cZone"></span></div><button id="cardToggle" aria-expanded="true">Hide</button></div>
  <h2 id="cTitle"></h2>
  <div class="when" id="cWhen"></div>
  <p id="cLede"></p>
  <div id="cChipsWrap" hidden><h3>Here</h3><div class="chips" id="cChips" style="margin-top:8px"></div></div>
  <div><h3>How to dress it</h3><ul id="cDress" style="margin-top:8px"></ul></div>
  <div class="budget"><b>On a tight budget</b><span id="cBudget"></span></div>
</aside>
<div id="map" class="panel"><canvas id="mapc" width="288" height="420" aria-label="Campus map"></canvas></div>
<div id="hint" class="panel">Drag to look <span class="k">· <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to walk · <kbd>Shift</kbd> to hurry</span> · or follow the stops</div>
<div id="pad"><button id="fwd" aria-label="Walk forward">▲</button><button id="back" aria-label="Walk back">▼</button></div>
<nav id="rail" aria-label="Walkthrough stops">
  <button class="step" id="prev" aria-label="Previous stop">‹</button>
  <div id="stopsWrap" class="panel"><ol id="stops"></ol></div>
  <button class="step" id="next" aria-label="Next stop">›</button>
  <span id="head" class="panel">HEAD → overview</span>
</nav>

<script src="/epoch/three.min.js"></script>
<script>

const CAMPUS = { x0: -125, x1: 92, z0: -195, z1: 152 };

const STRIP = { x0: 21, x1: 74, z0: -50.4, z1: -38.4 };     // bushy strip from the gate to the left turn

const STRIPS = [[STRIP.x0, STRIP.x1], [STRIP2.x0, STRIP2.x1]];

const STAGE = { x: 42, z: 92, w: 12, d: 5, h: 1.2 };        // on the track infield, facing north
const FIELD = [[22, -30], [88, -24], [78.4, 24], [64, 80], [56, 142], [38, 148], [6, 116], [10.4, 80], [16, 24], [19.2, -28]];

/* walking surface height: flat except the sunken courtyard, its east stairs and west ramp */
function H() { return 0; }   // the whole campus is at ground level

const WALK_TENTS = [
  ["Virtual Reality Merge Zone", "Play", 40], ["Retro Gaming Nexus", "Play", 40], ["Commit Lottery", "Play", 20], ["Dart Commit", "Play", 20],

  { name: "Code Puzzle", x: -26, z: 32 }, { name: "Debug Dash", x: -40, z: 24 },

            "Purple: the stalls along the road in front of Shivaji, with the track behind them. Mint: the making corner between the two blocks.",
