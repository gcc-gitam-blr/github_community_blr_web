name: Backup

# Every Sunday, a copy of the club's data (the "public" part of the Supabase database) is saved as a
# gzipped SQL file and kept for 30 days under Actions → Backup → the run → Artifacts.
# Needs the repository secret SUPABASE_DB_URL (Supabase → Connect → Session pooler). Without it the run
# says so and stops, green. Also needs BACKUP_PASSPHRASE: the file is always encrypted (gpg), because anyone signed in to GitHub can download a public
# repo's artifacts. Keep the passphrase safe.
# How to restore: README → Backups.

on:
  schedule:
    - cron: "40 20 * * 0" # Sunday 20:40 UTC (Monday 02:10 in India), before the weekly clean-up
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Is the database connected?
        id: check
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::No SUPABASE_DB_URL secret, so there is nothing to back up. Add it under Settings → Secrets and variables → Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pg_dump 17 (it must be at least as new as Supabase's Postgres)
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
      - name: Dump the club's data
        if: steps.check.outputs.skip != 'true'
        run: |
          set -o pipefail
          file="club-data-$(date -u +%F).sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --data-only --no-owner --no-privileges \
            --exclude-table-data=public.rate_hits | gzip -9 > "$file"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 "$file"
          rm "$file"; file="$file.gpg"
          echo "FILE=$file" >> "$GITHUB_ENV"
          echo "Saved $file ($(du -h "$file" | cut -f1))"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: club-data-backup
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
