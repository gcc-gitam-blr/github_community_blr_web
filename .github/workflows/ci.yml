name: CI

# Pushes run on main only: dev is kept level with main, so running it there too paid for the same commit twice.
# Pull requests still run it. Notes and docs can't break the site, so they don't spend ~10 minutes.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/workflows/uptime.yml", ".github/workflows/backup.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/workflows/uptime.yml", ".github/workflows/backup.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests (coin rules, ask engine, sign-ups, Supabase SQL in PGlite)
        run: npm test
      - name: Build
        id: build
        run: npm run build
      - name: Browser tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Keep the report if the browser tests fail
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      # Reuses the build above (demo mode, no secrets) instead of building twice: about 2 minutes for 5 pages.
      - name: Lighthouse (accessibility 0.95+ on every page; performance budgets only warn)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lighthouse
      - name: Keep the Lighthouse reports
        if: ${{ !cancelled() && hashFiles('.lighthouseci/*.html') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
