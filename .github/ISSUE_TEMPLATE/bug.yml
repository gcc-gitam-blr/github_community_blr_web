name: Bug report
description: Something on the site is broken or looks wrong
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: e.g. /epoch/wallet
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android, Chrome
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image here.
